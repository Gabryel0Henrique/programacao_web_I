<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    
    <table border="2">
        <caption>Usuarios Matriculados</caption>
        <thead>
            <tr>
                <th>nome</th>
                <th>idade</th>
                <th>Sexo</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>gilmar</td>
                <td>40</td>
                <td rowspan="4" align="center" >M</td>
            </tr>
            <tr>
                <td>antonio</td>
                <td>35</td>
                
            </tr>
            <tr>
                <td>zezin</td>
                <td>23</td>
                
            </tr>
            <tr>
                <td>toin</td>
                <td>52</td>
                
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>Qtd. Usuarios</td>
                <td colspan="2" align = "center"><mark>4</mark></td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
